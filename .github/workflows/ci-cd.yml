name: CI / CD

# CI runs on every push to main/dev and on PRs into main.
# CD (Railway deploy) runs only after tests pass on a push to main.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies from the lockfile (dev group included, for pytest and the test PDFs)
        run: uv sync --frozen
      - name: Run backend tests
        run: uv run pytest -q

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run frontend tests
        run: npm test

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    # Only deploy real pushes to main — never on PRs or dev.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm i -g @railway/cli@latest
      - name: Deploy (Dockerfile build on Railway)
        # RAILWAY_TOKEN is a project token (Railway → project → Settings →
        # Tokens), scoped to the production environment. `railway up` follows
        # the build and exits non-zero if it fails, so a bad build fails CD.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service web --ci
