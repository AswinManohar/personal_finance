<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cashflow — Private Ledger</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "tertiary": "#eec060",
            "surface-container-lowest": "#0d0e12",
            "surface-container": "#1f1f24",
            "on-surface": "#e3e2e7",
            "background": "#121317",
            "surface-container-low": "#1a1b20",
            "secondary-container": "#4c4844",
            "surface-bright": "#38393d",
            "surface-container-high": "#292a2e",
            "surface": "#121317",
            "surface-container-highest": "#343439",
            "on-background": "#e3e2e7",
            "outline": "#908fa0",
            "on-surface-variant": "#c7c4d7",
            "on-secondary": "#33302c",
            "outline-variant": "#464554",
            "secondary": "#ccc5c0",
            "primary-container": "#8183ff",
            "primary": "#c1c1ff",
            "surface-dim": "#121317",
            "surface-variant": "#343439",
            "inverse-surface": "#e3e2e7",
            "positive": "#3DD68C",
            "negative": "#F26B6B",
            "gold": "#D4A84B",
            // Hero numerals sit a touch warmer/brighter than body text.
            "hero": "#f0ede8"
          },
          fontFamily: {
            "headline": ["Inter"],
            "body": ["Inter"],
            "label": ["Inter"]
          },
          // Type scale from the mobile prototype. Tracking is baked in so a size
          // and its letter-spacing can never drift apart across screens.
          // Defaults (text-xs/sm/base…) stay available underneath.
          fontSize: {
            "nav":      ["9px",  { lineHeight: "1",    letterSpacing: "-0.01em" }],
            "micro":    ["10px", { lineHeight: "1.2" }],
            "label":    ["11px", { lineHeight: "1.3" }],
            "caption":  ["12px", { lineHeight: "1.4" }],
            "body":     ["13px", { lineHeight: "1.45" }],
            "body-lg":  ["14px", { lineHeight: "1.45" }],
            "title":    ["16px", { lineHeight: "1.3" }],
            "stat":     ["20px", { lineHeight: "1.2",  letterSpacing: "-0.02em" }],
            "ring":     ["22px", { lineHeight: "1",    letterSpacing: "-0.02em" }],
            "num-sm":   ["25px", { lineHeight: "1.1",  letterSpacing: "-0.02em" }],
            "num":      ["31px", { lineHeight: "1.1",  letterSpacing: "-0.02em" }],
            "num-lg":   ["39px", { lineHeight: "1",    letterSpacing: "-0.03em" }]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",     /*  8 — chips, pills */
            "field": "10px",    /* 10 — inputs, small buttons, icon boxes */
            "xl": "0.75rem",    /* 12 — list rows, large buttons */
            "card": "16px",
            "sheet": "20px",
            "full": "9999px"
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: #121317; color: #e3e2e7; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Phone shell ───────────────────────────────────────────────────────
       The prototype is a fixed-viewport app: header and nav are flex-none
       siblings of a scrolling main, not `fixed` overlays. That is what keeps
       a mobile URL bar (and, later, the Capacitor WebView) from jittering the
       layout, and it is the only arrangement where safe-area insets can be
       reserved rather than painted over. */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    /* Phone only. Desktop keeps normal document flow, so this must not leak
       past the breakpoint — expressed as a media query rather than a Tailwind
       `md:` override because both are single classes and the cascade order
       between this block and the runtime-injected utilities is not guaranteed. */
    @media (max-width: 767px) {
      .app-shell {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
    }
    /* Chrome sits inside its nominal height; the inset is added on top so the
       56/64px touch areas survive a notch or a gesture bar. */
    .app-header-safe {
      height: calc(56px + var(--safe-top));
      padding-top: var(--safe-top);
    }
    .app-nav-safe {
      height: calc(64px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
    }
    .app-sheet-safe { padding-bottom: calc(24px + var(--safe-bottom)); }
    .app-scroll { overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }

    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-toast-in { animation: toastIn .2s ease; }
    .animate-sheet-in { animation: sheetIn .22s cubic-bezier(.32, .72, 0, 1); }
    .animate-scrim-in { animation: scrimIn .2s ease; }
    @media (prefers-reduced-motion: reduce) {
      .animate-toast-in, .animate-sheet-in, .animate-scrim-in { animation: none; }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
